# On the server: /srv/translate (the deploy hook checks the code out there).
# /srv/translate/.env (never in git): see .env.example.
services:
  translate:
    build: .
    container_name: translate
    restart: unless-stopped
    env_file: .env
    # the database lives on the server, so a redeploy never loses it; the folder belongs to uid 1000
    # (the image's `node` user)
    volumes:
      - ./data:/app/data
    # a ceiling: a flood can't take the whole VPS, and the logs (with addresses) don't grow without end
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    # hardening (audit 31): nothing written outside data/, no privileges, a share of the 4 cores
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    cpus: 2
    environment:
      # no port is published, but the other projects' containers on the proxy network can reach this
      # one too: only Nginx Proxy Manager's own X-Forwarded-For counts (its container's name, looked
      # up with Docker's DNS; audit 31)
      TRUST_PROXY: 'true'
      TRUST_PROXY_FROM: proxy-npm-1
    networks:
      - proxy

networks:
  proxy:
    external: true
